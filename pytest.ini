[pytest]
# Options the Home Assistant test rig needs (see tests/test_device_registry.py).
# Without a rig installed pytest reports the asyncio_* ones as unknown options
# and carries on; the rig-less tests don't use them.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Home Assistant aliases httpx when it is first imported, which must happen
# before the respx pytest plugin imports httpx. Only the plugin is disabled.
addopts = -p no:respx
pythonpath = .
testpaths = tests
